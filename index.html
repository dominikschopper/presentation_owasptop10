  <style>
    /* Chapter subtitle lines inside trennblatt slides */
    .edition  { font-size: 0.55em; color: rgba(255,255,255,0.65); font-family: monospace; }
    .subtitle { font-size: 0.75em; color: rgba(255,255,255,0.85); margin-top: 0.6em; line-height: 1.5; }

    /* Blockquote — orange left bar, fits light background */
    .reveal blockquote {
      border-left: 4px solid var(--c-orange);
      background: rgba(253, 98, 2, 0.06);
      color: var(--c-black);
      font-style: normal;
      padding: 0.6em 1em;
      width: 88%;
    }

    /* Risk badges */
    .badge {
      display: inline-block;
      padding: 0.1em 0.55em;
      border-radius: 3px;
      font-size: 0.5em;
      font-weight: 700;
      vertical-align: middle;
      margin-left: 0.5em;
      letter-spacing: 0.03em;
    }
    .badge-critical { background: var(--c-orange);  color: #fff; }
    .badge-high     { background: var(--c-blue);    color: #fff; }
    .badge-medium   { background: var(--c-purple);  color: #fff; }

    /* Threat title slide — risk indicator under the heading */
    .reveal .risk-line {
      font-size: 0.65em;
      color: var(--c-grey);
      margin-top: -0.5em;
      margin-bottom: 1em;
    }
    .risk-critical { color: var(--c-orange); font-weight: 700; }
    .risk-high     { color: var(--c-blue);   font-weight: 700; }
    .risk-medium   { color: var(--c-purple); font-weight: 700; }

    /* Overview tables — orange header row */
    .reveal table th {
      background: var(--c-orange);
      color: #fff;
      border-color: var(--c-orange);
    }
    .reveal table td { border-color: var(--c-grey-light); }
    .reveal table tbody tr:hover td { background: rgba(253,98,2,0.05); }
    /* links in tables use purple (already theme default, reinforcing) */
    .reveal table a { color: var(--c-purple); }

    /* Code blocks — light github theme, thin border for definition on white bg */
    .reveal pre {
      font-size: 0.62em;
      border-radius: 6px;
      border: 1px solid var(--c-grey-light);
      box-shadow: none;
    }

    /* Inline code on light bg */
    .reveal :not(pre) > code {
      background: rgba(253,98,2,0.08);
      color: var(--c-orange);
      border-radius: 3px;
      padding: 0.05em 0.3em;
    }

    /* Two-column grid helper */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5em;
      align-items: start;
    }

    /* Incident / example highlight box */
    .incident {
      background: rgba(253,98,2,0.06);
      border: 1px solid var(--c-grey-light);
      border-left: 4px solid var(--c-orange);
      border-radius: 4px;
      padding: 0.6em 1em;
      margin: 0.4em 0;
      font-size: 0.82em;
      text-align: left;
    }
    .incident .title { font-weight: 700; color: var(--c-orange); }

    /* Green "fixed" annotation, orange "vulnerable" annotation */
    .label-fixed { color: var(--c-green); font-weight: 700; font-size: 0.75em; }
    .label-vuln  { color: var(--c-orange); font-weight: 700; font-size: 0.75em; }

    /* PDF export */
    @media print {
      .reveal .slides section { page-break-after: always; }
    }
  </style>
</head>
